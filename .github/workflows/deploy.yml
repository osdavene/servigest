name: 🚀 Despliegue Automático a AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Desplegar en Servidor AWS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Ejecutar Despliegue en AWS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Iniciando despliegue de ServiGest en CloudPanel..."
            cd ${{ secrets.AWS_PROJECT_PATH }}

            # Configurar directorio seguro para Git
            sudo git config --global --add safe.directory ${{ secrets.AWS_PROJECT_PATH }}

            # 1. Descargar últimos cambios como usuario del sitio
            sudo -u servigest git fetch origin main
            sudo -u servigest git reset --hard origin/main

            # 2. Instalar/actualizar dependencias
            sudo -u servigest composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # 3. Ejecutar migraciones de base de datos
            sudo -u servigest php artisan migrate --force

            # 4. Limpiar y recompilar cachés
            sudo -u servigest php artisan config:cache
            sudo -u servigest php artisan route:cache
            sudo -u servigest php artisan view:cache

            # 5. Enlace simbólico de almacenamiento
            sudo -u servigest php artisan storage:link || true

            # 6. Asegurar que la aplicación esté SIEMPRE activa
            sudo -u servigest php artisan up || true

            echo "✅ ¡Despliegue completado exitosamente con 0 downtime!"
