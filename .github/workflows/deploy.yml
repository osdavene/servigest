name: 🚀 Despliegue Automático a AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Desplegar en Servidor AWS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Ejecutar Despliegue en AWS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Iniciando despliegue de ServiGest en CloudPanel..."
            cd ${{ secrets.AWS_PROJECT_PATH }}

            # 1. Poner en mantenimiento
            php artisan down --secret="deploy-bypass-token" || true

            # 2. Descargar últimos cambios
            git pull origin main

            # 3. Dependencias de producción
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # 4. Migraciones
            php artisan migrate --force

            # 5. Optimizar cachés
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 6. Enlace de almacenamiento
            php artisan storage:link || true

            # 7. Reactivar la aplicación
            php artisan up

            echo "✅ ¡Despliegue completado exitosamente en AWS CloudPanel!"
